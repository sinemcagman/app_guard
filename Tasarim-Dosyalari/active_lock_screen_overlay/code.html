<style>
        .glass-overlay {
            backdrop-filter: blur(24px);
            background: linear-gradient(180deg, rgba(16, 20, 26, 0.85) 0%, rgba(16, 20, 26, 0.95) 100%);
        }
        .pin-dot {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pin-dot.filled {
            background-color: #00dbe9;
            box-shadow: 0 0 12px rgba(0, 219, 233, 0.6);
            transform: scale(1.2);
        }
        .key-active:active {
            transform: scale(0.92);
            background-color: rgba(0, 219, 233, 0.1);
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(187, 24, 36, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(187, 24, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(187, 24, 36, 0); }
        }
        .alert-pulse {
            animation: pulse-red 2s infinite;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen overflow-hidden flex flex-col items-center">
<!-- Mock Background Content (Blurred) -->
<div class="fixed inset-0 z-0 grid grid-cols-2 gap-4 p-margin-mobile">
<div class="bg-surface-container h-40 rounded-xl border border-outline-variant p-4 flex flex-col justify-end">
<div class="w-12 h-12 bg-primary/20 rounded-lg mb-2"></div>
<div class="h-4 w-24 bg-outline-variant rounded"></div>
</div>
<div class="bg-surface-container h-40 rounded-xl border border-outline-variant p-4 flex flex-col justify-end">
<div class="w-12 h-12 bg-primary/20 rounded-lg mb-2"></div>
<div class="h-4 w-20 bg-outline-variant rounded"></div>
</div>
<div class="bg-surface-container h-40 rounded-xl border border-outline-variant p-4 flex flex-col justify-end">
<div class="w-12 h-12 bg-primary/20 rounded-lg mb-2"></div>
<div class="h-4 w-28 bg-outline-variant rounded"></div>
</div>
<div class="bg-surface-container h-40 rounded-xl border border-outline-variant p-4 flex flex-col justify-end">
<div class="w-12 h-12 bg-primary/20 rounded-lg mb-2"></div>
<div class="h-4 w-16 bg-outline-variant rounded"></div>
</div>
</div>
<!-- MAIN LOCK OVERLAY -->
<div class="fixed inset-0 z-50 glass-overlay flex flex-col items-center justify-between px-margin-mobile py-xl">
<!-- Header Info -->
<div class="w-full flex flex-col items-center text-center mt-xl">
<div class="w-24 h-24 rounded-full bg-on-tertiary-container/10 flex items-center justify-center mb-md border border-on-tertiary-container/30 alert-pulse">
<span class="material-symbols-outlined text-[48px] text-on-tertiary-container" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Unauthorized Exit Detected</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                Enter your Master PIN or Scan Fingerprint to restore full access to your device.
            </p>
</div>
<!-- PIN Dots -->
<div class="flex space-x-6 my-lg" id="pin-display">
<div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-outline"></div>
<div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-outline"></div>
<div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-outline"></div>
<div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-outline"></div>
</div>
<!-- Keypad -->
<div class="grid grid-cols-3 gap-y-4 gap-x-8 w-full max-w-[320px] mb-xl">
<button class="key-active w-20 h-20 rounded-full flex flex-col items-center justify-center border border-outline-variant bg-surface-container-low transition-all" onclick="pressKey('1')">
<span class="font-headline-md text-headline-md">1</span>
</button>
<button class="key-active w-20 h-20 rounded-full flex flex-col items-center justify-center border border-outline-variant bg-surface-container-low transition-all" onclick="pressKey('2')">
<span class="font-headline-md text-headline-md">2</span>
<span class="text-[10px] text-on-surface-variant tracking-widest font-label-sm">ABC</span>
</button>
<button class="key-active w-20 h-20 rounded-full flex flex-col items-center justify-center border border-outline-variant bg-surface-container-low transition-all" onclick="pressKey('3')">
<span class="font-headline-md text-headline-md">3</span>
<span class="text-[10px] text-on-surface-variant tracking-widest font-label-sm">DEF</span>
</button>
<button class="key-active w-20 h-20 rounded-full flex flex-col items-center justify-center border border-outline-variant bg-surface-container-low transition-all" onclick="pressKey('4')">
<span class="font-headline-md text-headline-md">4</span>
<span class="text-[10px] text-on-surface-variant tracking-widest font-label-sm">GHI</span>
</button>
<button class="key-active w-20 h-20 rounded-full flex flex-col items-center justify-center border border-outline-variant bg-surface-container-low transition-all" onclick="pressKey('5')">
<span class="font-headline-md text-headline-md">5</span>
<span class="text-[10px] text-on-surface-variant tracking-widest font-label-sm">JKL</span>
</button>
<button class="key-active w-20 h-20 rounded-full flex flex-col items-center justify-center border border-outline-variant bg-surface-container-low transition-all" onclick="pressKey('6')">
<span class="font-headline-md text-headline-md">6</span>
<span class="text-[10px] text-on-surface-variant tracking-widest font-label-sm">MNO</span>
</button>
<button class="key-active w-20 h-20 rounded-full flex flex-col items-center justify-center border border-outline-variant bg-surface-container-low transition-all" onclick="pressKey('7')">
<span class="font-headline-md text-headline-md">7</span>
<span class="text-[10px] text-on-surface-variant tracking-widest font-label-sm">PQRS</span>
</button>
<button class="key-active w-20 h-20 rounded-full flex flex-col items-center justify-center border border-outline-variant bg-surface-container-low transition-all" onclick="pressKey('8')">
<span class="font-headline-md text-headline-md">8</span>
<span class="text-[10px] text-on-surface-variant tracking-widest font-label-sm">TUV</span>
</button>
<button class="key-active w-20 h-20 rounded-full flex flex-col items-center justify-center border border-outline-variant bg-surface-container-low transition-all" onclick="pressKey('9')">
<span class="font-headline-md text-headline-md">9</span>
<span class="text-[10px] text-on-surface-variant tracking-widest font-label-sm">WXYZ</span>
</button>
<div class="w-20 h-20"></div>
<button class="key-active w-20 h-20 rounded-full flex items-center justify-center border border-outline-variant bg-surface-container-low transition-all" onclick="pressKey('0')">
<span class="font-headline-md text-headline-md">0</span>
</button>
<button class="key-active w-20 h-20 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary-fixed-dim transition-colors" onclick="backspace()">
<span class="material-symbols-outlined text-[28px]">backspace</span>
</button>
</div>
<!-- Biometric Bottom Action -->
<button class="flex flex-col items-center group mb-4 active:scale-95 transition-transform">
<div class="w-16 h-16 rounded-full border border-primary-fixed-dim/30 bg-primary-fixed-dim/5 flex items-center justify-center mb-2 group-hover:bg-primary-fixed-dim/10 transition-all">
<span class="material-symbols-outlined text-primary-fixed-dim text-[32px]">fingerprint</span>
</div>
<span class="font-label-sm text-label-sm text-primary-fixed-dim tracking-[0.1em]">TAP TO SCAN</span>
</button>
<div class="text-[10px] font-label-sm text-outline opacity-40 uppercase tracking-widest">
            Security Layer v4.2.0-secure
        </div>
</div>
<!-- Emergency Link -->
<div class="fixed bottom-margin-mobile z-50 w-full text-center hidden">
<a class="font-label-sm text-label-sm text-on-tertiary-container/80 underline decoration-on-tertiary-container/30" href="#">Emergency Exit</a>
</div>
<script>
        let pin = "";
        const dots = document.querySelectorAll('.pin-dot');

        function pressKey(num) {
            if (pin.length < 4) {
                pin += num;
                updateDisplay();
                
                // Trigger tactile feedback
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(20);
                }

                if (pin.length === 4) {
                    validatePin();
                }
            }
        }

        function backspace() {
            if (pin.length > 0) {
                pin = pin.slice(0, -1);
                updateDisplay();
            }
        }

        function updateDisplay() {
            dots.forEach((dot, index) => {
                if (index < pin.length) {
                    dot.classList.add('filled', 'bg-primary-fixed-dim', 'border-primary-fixed-dim');
                    dot.classList.remove('border-outline');
                } else {
                    dot.classList.remove('filled', 'bg-primary-fixed-dim', 'border-primary-fixed-dim');
                    dot.classList.add('border-outline');
                }
            });
        }

        function validatePin() {
            // Shake animation on error simulation
            const pinDisplay = document.getElementById('pin-display');
            pinDisplay.classList.add('animate-shake');
            
            setTimeout(() => {
                // For demo, just clear after delay
                pin = "";
                updateDisplay();
            }, 800);
        }

        // Add shake keyframe style dynamically
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-8px); }
                75% { transform: translateX(8px); }
            }
            .animate-shake {
                animation: shake 0.2s ease-in-out 0s 2;
            }
        `;
        document.head.appendChild(styleSheet);
    </script>
</body></html>
