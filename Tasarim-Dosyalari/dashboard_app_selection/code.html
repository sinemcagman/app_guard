<style>
        body { background-color: #10141a; color: #dfe2eb; overflow-x: hidden; }
        .glass-panel { backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .inner-glow-btn { box-shadow: inset 0 0.5px 0 0 rgba(255,255,255,0.1); }
        .custom-toggle input:checked + .slider { background-color: #93000a; }
        .custom-toggle input:checked + .slider:before { transform: translateX(20px); }
        .slider { transition: .4s; }
        .slider:before { transition: .4s; content: ""; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #31353c; border-radius: 10px; }
    </style>

<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-outline-variant flex justify-between items-center w-full px-margin-mobile h-16">
<div class="flex items-center gap-3">
<div class="w-8 h-8 flex items-center justify-center rounded-lg bg-primary-container/10">
<img alt="AppGuard Logo" class="w-6 h-6 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDElD7O1C9HXVAU8nA8t04L76iwFZcD6eHc7zOm3GM3yApJ9YcZMZPhF26A2yJwldxlyIVfn_nlWqlQ84OW1CULPhBXN9hFPTQfjeX657CAnYxJkrcihu6OrkWNuG7B4OTCDhO82gVcqr3F3w_J4XzAAkZ144lE24OV_urg71byEGH-M7BOQenIp0osyimrers737QOML-4v3v7IRIvMZCtmSy9ez2AdbWXXDSsBbMHpuntUH3cw3onHg"/>
</div>
<span class="font-headline-md text-headline-md font-bold text-primary-fixed-dim">AppGuard</span>
</div>
<div class="flex items-center gap-2 px-3 py-1 bg-primary-container/20 border border-primary-fixed-dim/30 rounded-full animate-pulse">
<span class="material-symbols-outlined text-[14px] text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="font-label-sm text-label-sm text-primary-fixed-dim">Secure</span>
</div>
</header>
<main class="flex-1 mt-16 mb-32 px-margin-mobile pt-lg flex flex-col gap-lg">
<!-- Search and Filter -->
<div class="flex flex-col gap-md">
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-fixed-dim transition-colors">search</span>
<input class="w-full bg-surface-container-low border-b border-outline-variant focus:border-primary-fixed-dim focus:ring-0 text-body-lg font-body-lg pl-12 py-4 transition-all outline-none rounded-t-xl" placeholder="Search apps..." type="text"/>
</div>
<div class="flex gap-xs overflow-x-auto pb-2 no-scrollbar">
<div class="flex items-center px-4 py-2 bg-primary-container text-on-primary-container rounded-full font-label-sm text-label-sm">All Apps</div>
<div class="flex items-center px-4 py-2 bg-surface-container-high text-on-surface-variant rounded-full font-label-sm text-label-sm hover:bg-surface-variant transition-colors">Social</div>
<div class="flex items-center px-4 py-2 bg-surface-container-high text-on-surface-variant rounded-full font-label-sm text-label-sm hover:bg-surface-variant transition-colors">System</div>
<div class="flex items-center px-4 py-2 bg-surface-container-high text-on-surface-variant rounded-full font-label-sm text-label-sm hover:bg-surface-variant transition-colors">Utility</div>
</div>
</div>
<!-- App Grid -->
<div class="grid grid-cols-1 gap-md">
<!-- App Card: Phone -->
<div class="group flex items-center bg-surface-container border border-outline-variant rounded-xl p-md hover:border-primary-fixed-dim/50 transition-all">
<div class="w-12 h-12 rounded-xl bg-[#1d3d47] flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-primary-fixed-dim text-3xl">call</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg font-semibold text-on-surface">Phone</h3>
<span class="font-label-sm text-label-sm text-on-surface-variant px-2 py-0.5 bg-surface-container-highest rounded border border-outline-variant">System</span>
</div>
<label class="custom-toggle relative inline-block w-12 h-6 cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="slider absolute inset-0 bg-[#30363D] rounded-full before:absolute before:left-1 before:top-1 before:bg-white before:w-4 before:h-4 before:rounded-full"></div>
</label>
</div>
<!-- App Card: WhatsApp -->
<div class="group flex items-center bg-surface-container border border-outline-variant rounded-xl p-md hover:border-primary-fixed-dim/50 transition-all">
<div class="w-12 h-12 rounded-xl bg-[#075E54]/20 flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-[#25D366] text-3xl">chat</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg font-semibold text-on-surface">WhatsApp</h3>
<span class="font-label-sm text-label-sm text-on-surface-variant px-2 py-0.5 bg-surface-container-highest rounded border border-outline-variant">Social</span>
</div>
<label class="custom-toggle relative inline-block w-12 h-6 cursor-pointer">
<input class="sr-only peer" type="checkbox"/>
<div class="slider absolute inset-0 bg-[#30363D] rounded-full before:absolute before:left-1 before:top-1 before:bg-white before:w-4 before:h-4 before:rounded-full"></div>
</label>
</div>
<!-- App Card: Photos -->
<div class="group flex items-center bg-surface-container border border-outline-variant rounded-xl p-md hover:border-primary-fixed-dim/50 transition-all">
<div class="w-12 h-12 rounded-xl bg-[#4285F4]/20 flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-primary-fixed-dim text-3xl">photo_library</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg font-semibold text-on-surface">Photos</h3>
<span class="font-label-sm text-label-sm text-on-surface-variant px-2 py-0.5 bg-surface-container-highest rounded border border-outline-variant">Gallery</span>
</div>
<label class="custom-toggle relative inline-block w-12 h-6 cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="slider absolute inset-0 bg-[#30363D] rounded-full before:absolute before:left-1 before:top-1 before:bg-white before:w-4 before:h-4 before:rounded-full"></div>
</label>
</div>
<!-- App Card: YouTube -->
<div class="group flex items-center bg-surface-container border border-outline-variant rounded-xl p-md hover:border-primary-fixed-dim/50 transition-all">
<div class="w-12 h-12 rounded-xl bg-[#FF0000]/20 flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-[#FF0000] text-3xl">play_circle</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg font-semibold text-on-surface">YouTube</h3>
<span class="font-label-sm text-label-sm text-on-surface-variant px-2 py-0.5 bg-surface-container-highest rounded border border-outline-variant">Media</span>
</div>
<label class="custom-toggle relative inline-block w-12 h-6 cursor-pointer">
<input class="sr-only peer" type="checkbox"/>
<div class="slider absolute inset-0 bg-[#30363D] rounded-full before:absolute before:left-1 before:top-1 before:bg-white before:w-4 before:h-4 before:rounded-full"></div>
</label>
</div>
<!-- App Card: Settings -->
<div class="group flex items-center bg-surface-container border border-outline-variant rounded-xl p-md hover:border-primary-fixed-dim/50 transition-all">
<div class="w-12 h-12 rounded-xl bg-surface-container-highest flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-outline text-3xl">settings</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg font-semibold text-on-surface">Settings</h3>
<span class="font-label-sm text-label-sm text-on-surface-variant px-2 py-0.5 bg-surface-container-highest rounded border border-outline-variant">System</span>
</div>
<label class="custom-toggle relative inline-block w-12 h-6 cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="slider absolute inset-0 bg-[#30363D] rounded-full before:absolute before:left-1 before:top-1 before:bg-white before:w-4 before:h-4 before:rounded-full"></div>
</label>
</div>
<!-- App Card: Vault (Premium Feature Suggestion) -->
<div class="group flex items-center bg-gradient-to-r from-surface-container to-primary-container/5 border border-primary-fixed-dim/20 rounded-xl p-md transition-all">
<div class="w-12 h-12 rounded-xl bg-primary-container/20 flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-primary-fixed-dim text-3xl">lock_open</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg font-semibold text-primary-fixed-dim">Private Vault</h3>
<span class="font-label-sm text-label-sm text-primary-fixed-dim px-2 py-0.5 bg-primary-container/20 rounded border border-primary-fixed-dim/30">Secure Storage</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
</div>
</main>
<!-- Sticky Action Bar -->
<div class="fixed bottom-16 left-0 w-full p-margin-mobile z-50">
<button class="w-full bg-primary-container text-on-primary-fixed h-16 rounded-xl flex items-center justify-center gap-3 active:scale-[0.98] transition-transform inner-glow-btn shadow-lg shadow-primary-container/20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="font-headline-md text-headline-md tracking-tight uppercase">Launch in Pinned Mode</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface/90 dark:bg-surface/90 backdrop-blur-xl border-t border-outline-variant flex justify-around items-center px-4 py-3">
<button class="flex flex-col items-center justify-center bg-primary-container/20 text-primary-fixed-dim rounded-full px-4 py-1">
<span class="material-symbols-outlined">grid_view</span>
<span class="font-label-sm text-label-sm">Apps</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined">enhanced_encryption</span>
<span class="font-label-sm text-label-sm">Vault</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined">history</span>
<span class="font-label-sm text-label-sm">History</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</button>
</nav>
<script>
        // Micro-interaction for toggle switches
        document.querySelectorAll('input[type="checkbox"]').forEach(toggle => {
            toggle.addEventListener('change', (e) => {
                const card = e.target.closest('.group');
                if (e.target.checked) {
                    card.classList.add('border-primary-fixed-dim/50');
                    card.style.transform = 'scale(1.02)';
                    setTimeout(() => card.style.transform = 'scale(1)', 100);
                } else {
                    card.classList.remove('border-primary-fixed-dim/50');
                }
            });
        });

        // Search bar focus effect
        const searchInput = document.querySelector('input[type="text"]');
        searchInput.addEventListener('focus', () => {
            searchInput.parentElement.classList.add('scale-[1.01]');
        });
        searchInput.addEventListener('blur', () => {
            searchInput.parentElement.classList.remove('scale-[1.01]');
        });
    </script>
</body></html>
