<style>

        .pin-dot.filled {
            background-color: #00dbe9;
            box-shadow: 0 0 12px rgba(0, 219, 233, 0.6);

            70% { box-shadow: 0 0 0 15px rgba(0, 219, 233, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 219, 233, 0); }
        }
        .pulse-active {
            animation: pulse-cyan 2s infinite;
        }

<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden flex flex-col items-center justify-center">

</div>
<div class="fixed inset-0 bg-surface/40 backdrop-blur-md z-10"></div>
<main class="relative z-20 w-full max-w-md mx-auto h-[90vh] md:h-[800px] flex flex-col justify-end px-margin-mobile pb-margin-mobile">
<div class="glass-panel rounded-full overflow-hidden flex flex-col max-h-[95%] animate-in fade-in slide-in-from-bottom-10 duration-500">
<header class="technical-border p-6 text-center space-y-2">
<div class="flex justify-center mb-4">
<div class="w-12 h-12 rounded-xl bg-primary-container/10 flex items-center justify-center border border-primary-fixed-dim/30">
<span class="material-symbols-outlined text-primary-fixed-dim text-3xl">shield</span>
</div>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Set Security Method for Unlocking</h1>
<p class="font-body-md text-on-surface-variant px-4">Create a 4-digit PIN to secure your active application session.</p>
</header>
<div class="flex-1 overflow-y-auto p-6 space-y-8">
<div class="flex flex-col items-center space-y-6">
<div class="flex gap-4" id="pin-display">
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant"></div>
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant"></div>
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant"></div>
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant"></div>
</div>
<div class="grid grid-cols-3 gap-4 w-full max-w-[280px]">
<button class="h-16 rounded-full flex items-center justify-center font-headline-md text-headline-md bg-surface-container-high text-on-surface hover:bg-primary-fixed-dim hover:text-on-primary transition-all active:scale-90" onclick="inputPin(1)">1</button>
<button class="h-16 rounded-full flex items-center justify-center font-headline-md text-headline-md bg-surface-container-high text-on-surface hover:bg-primary-fixed-dim hover:text-on-primary transition-all active:scale-90" onclick="inputPin(2)">2</button>
<button class="h-16 rounded-full flex items-center justify-center font-headline-md text-headline-md bg-surface-container-high text-on-surface hover:bg-primary-fixed-dim hover:text-on-primary transition-all active:scale-90" onclick="inputPin(3)">3</button>
<button class="h-16 rounded-full flex items-center justify-center font-headline-md text-headline-md bg-surface-container-high text-on-surface hover:bg-primary-fixed-dim hover:text-on-primary transition-all active:scale-90" onclick="inputPin(4)">4</button>
<button class="h-16 rounded-full flex items-center justify-center font-headline-md text-headline-md bg-surface-container-high text-on-surface hover:bg-primary-fixed-dim hover:text-on-primary transition-all active:scale-90" onclick="inputPin(5)">5</button>
<button class="h-16 rounded-full flex items-center justify-center font-headline-md text-headline-md bg-surface-container-high text-on-surface hover:bg-primary-fixed-dim hover:text-on-primary transition-all active:scale-90" onclick="inputPin(6)">6</button>
<button class="h-16 rounded-full flex items-center justify-center font-headline-md text-headline-md bg-surface-container-high text-on-surface hover:bg-primary-fixed-dim hover:text-on-primary transition-all active:scale-90" onclick="inputPin(7)">7</button>
<button class="h-16 rounded-full flex items-center justify-center font-headline-md text-headline-md bg-surface-container-high text-on-surface hover:bg-primary-fixed-dim hover:text-on-primary transition-all active:scale-90" onclick="inputPin(8)">8</button>
<button class="h-16 rounded-full flex items-center justify-center font-headline-md text-headline-md bg-surface-container-high text-on-surface hover:bg-primary-fixed-dim hover:text-on-primary transition-all active:scale-90" onclick="inputPin(9)">9</button>
<div class="h-16"></div>
<button class="h-16 rounded-full flex items-center justify-center font-headline-md text-headline-md bg-surface-container-high text-on-surface hover:bg-primary-fixed-dim hover:text-on-primary transition-all active:scale-90" onclick="inputPin(0)">0</button>
<button class="h-16 rounded-full flex items-center justify-center text-on-surface-variant hover:text-error transition-all active:scale-90" onclick="clearPin()">
<span class="material-symbols-outlined text-2xl">backspace</span>

<input checked="" class="sr-only peer" type="checkbox"/>

</label>

<div class="p-4 bg-primary-container/5 rounded-xl border-l-4 border-primary-fixed-dim">
<div class="flex gap-3">
<span class="material-symbols-outlined text-primary-fixed-dim text-sm mt-1">info</span>
<p class="font-label-sm text-label-sm text-on-surface-variant leading-relaxed">
                                Once launched, exiting the selected application will automatically lock the phone and demand this PIN/Biometrics.
                            </p>
</div>
</div>
</div>
</div>
<footer class="p-6 pt-0">
<button class="w-full bg-primary-fixed-dim text-on-primary font-headline-md py-4 rounded-xl flex items-center justify-center gap-3 active:scale-95 transition-all shadow-[0_0_20px_rgba(0,219,233,0.3)] hover:shadow-[0_0_30px_rgba(0,219,233,0.5)]" id="activate-btn">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lock</span>
                    Activate & Lock App
                </button>
<button class="w-full py-4 text-on-surface-variant font-label-sm hover:text-on-surface transition-colors">
                    Cancel & Return to Dashboard
                </button>
</footer>

</main>
<script>
        let currentPin = '';
        const pinDots = document.querySelectorAll('.pin-dot');
        const activateBtn = document.getElementById('activate-btn');

        function inputPin(num) {
            if (currentPin.length < 4) {
                currentPin += num;
                updatePinDisplay();
            }
        }

        function clearPin() {
            currentPin = currentPin.slice(0, -1);
            updatePinDisplay();
        }

        function updatePinDisplay() {
            pinDots.forEach((dot, index) => {
                if (index < currentPin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            });

            if (currentPin.length === 4) {
                activateBtn.classList.add('pulse-active');
            } else {
                activateBtn.classList.remove('pulse-active');
            }
        }

        // Interaction for "Activate & Lock App"
        activateBtn.addEventListener('click', () => {
            if (currentPin.length === 4) {
                activateBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Securing Application...';
                setTimeout(() => {
                    activateBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Application Locked';
                    activateBtn.classList.remove('bg-primary-fixed-dim');
                    activateBtn.classList.add('bg-on-surface', 'text-surface');
                }, 1500);
            } else {
                // Shake effect on dots
                const container = document.getElementById('pin-display');
                container.classList.add('animate-bounce');
                setTimeout(() => container.classList.remove('animate-bounce'), 500);
            }
        });
    </script>
